# -------------------------------------------------
# Hyprlock Config - Rosé Pine Dawn (Centered)
# -------------------------------------------------

# --- Define Rosé Pine Dawn Colors ---
$base    = 0xfffaf4ed
$surface = 0xfffffaf3
$overlay = 0xfff2e9de
$text    = 0xff575279
$love    = 0xffb4637a
$rose    = 0xffd7827e
$iris    = 0xff907aa9

# --- Background ---
background {
    path = ~/Pictures/Wallpapers/leafy-dawn.png  # Optional: Set your wallpaper
    color = $base
}

# --- Clock ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%R")"
    color = $rose           # <-- Set to Rosé Pine "Rose"
    font_size = 90
    font_family = FiraCode Nerd Font
    
    # --- Position: Center ---
    position = 0, 80
    halign = center
    valign = center
}

# --- Input Field (Password) ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2 
    inner_color = $surface
    outer_color = $overlay
    font_color = $iris
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10           # Rounded corners
    
    # --- Position: Center ---
    position = 0, -20
    halign = center
    valign = center
}


